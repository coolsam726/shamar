packages:
  - 'packages/*'
  - 'apps/*'

# Ace 14.1.0 fails command indexing on Node.js 24.20+ (jsonschema URL parsing).
# @adonisjs/core 7.3.5 allows ^14.1.0; force the 14.1.1 schema-id fix.
overrides:
  '@adonisjs/ace': '14.1.1'

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true

onlyBuiltDependencies:
  - better-sqlite3

name: Deploy demo

# Build the playground image, push to GHCR, then SSH-restart the VPS stack.
# Triggered by a published GitHub Release (same cadence as npm publish).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (default latest)
        required: false
        default: latest

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coolsam726/shamar-demo

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag || 'latest' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved IMAGE_TAG=${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_VPS_DEPLOY != 'false' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEMO_VPS_HOST }}
          username: ${{ secrets.DEMO_VPS_USER }}
          key: ${{ secrets.DEMO_VPS_SSH_KEY }}
          port: ${{ secrets.DEMO_VPS_PORT }}
          script: |
            set -euo pipefail
            cd /opt/shamar
            if [[ ! -f .env ]]; then
              echo "Missing /opt/shamar/.env" >&2
              exit 1
            fi
            # Keep secrets; pin the release tag for this deploy.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ needs.image.outputs.tag }}/" .env
            else
              echo "IMAGE_TAG=${{ needs.image.outputs.tag }}" >> .env
            fi
            chmod +x ./deploy.sh
            ./deploy.sh

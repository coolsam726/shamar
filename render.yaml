# Demo panel only: https://demo.shamar.dev
# The landing page and docs are a Cloudflare Pages site at https://shamar.dev.
# DNS for shamar.dev stays in Cloudflare.
# Blueprint → New from repo.
# MongoDB is not included. Create an Atlas cluster and set MONGO_URI.
# APP_KEY and DEMO_RESET_TOKEN are generated once and kept by Render.

services:
  - type: web
    name: shamar-playground
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains:
      - demo.shamar.dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: SHAMAR_DEMO_MODE
        value: "true"
      - key: APP_URL
        value: https://demo.shamar.dev
      - key: DEMO_DOCS_ORIGIN
        value: https://shamar.dev
      - key: APP_KEY
        generateValue: true
      - key: DEMO_RESET_TOKEN
        generateValue: true
      - key: MONGO_URI
        sync: false

# Cloudflare Workers (static assets) — shamar.dev (landing + docs)
name = "shamar"
compatibility_date = "2026-08-01"

# Workers Builds runs `wrangler deploy` (not `pages deploy`).
# Keep assets / compatibility at top level — do not nest under previews.
[assets]
directory = "./dist"

# Required for Worker Previews (`wrangler preview` / PR builds).
# Must be an inline empty table (`previews = {}`); a bare `[previews]`
# section is often dropped when the file is parsed, which breaks previews.
previews = {}

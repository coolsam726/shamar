# Cloudflare Workers (static assets) — shamar.dev (landing + docs)
name = "shamar"
compatibility_date = "2026-08-01"

# Worker Previews (PR / non-production builds via `npx wrangler preview`).
# Must be root-level keys BEFORE any [table] header (TOML scoping).
# Requires Wrangler ≥ 4.135. In Cloudflare: Preview deploy command =
# `npx wrangler preview` (not `wrangler deploy`).
preview_urls = true
previews = {}

# Production deploy: `npx wrangler deploy`
[assets]
directory = "./dist"
